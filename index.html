<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة إدخال بيانات الفرصة التطوعية</title>
    <style>
        body {
            font-family: 'Tahoma', Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2, h3 {
            text-align: center;
            color: #2c3e50;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #fdfdfd;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #219653;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .status-accepted {
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>إدارة بيانات الفرصة التطوعية</h2>
    
    <!-- نموذج الإدخال -->
    <div class="form-group">
        <input type="text" id="studentName" placeholder="اسم الطالب الكامل">
        <input type="text" id="studentClass" placeholder="الفصل (مثال: 3/1)">
        <button id="saveBtn">حفظ وإضافة للسحابة</button>
    </div>

    <h3>بيان الطلاب المقبولين</h3>
    <table>
        <thead>
            <tr>
                <th>م</th>
                <th>اسم الطالب</th>
                <th>الفصل</th>
                <th>حالة القبول</th>
                <th>حالة إتمام العمل</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- يتم تعبئة البيانات لحظياً من السحابة -->
        </tbody>
    </table>
</div>

<!-- كود السحابة والربط التفاعلي -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDYUF6MuzyQQIqnd_IqFMGrx",
        authDomain: "your-apps-3511e.firebaseapp.com",
        projectId: "your-apps-3511e",
        storageBucket: "your-apps-3511e.firebasestorage.app",
        messagingSenderId: "309311377713",
        appId: "1:309311377713:web:2fb740e8e687af40f2010",
        measurementId: "G-MLCQ329BSV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const nameInput = document.getElementById('studentName');
    const classInput = document.getElementById('studentClass');
    const saveBtn = document.getElementById('saveBtn');
    const tableBody = document.getElementById('tableBody');

    // حفظ البيانات في السحابة عند الضغط على الزر
    saveBtn.addEventListener('click', async () => {
        const name = nameInput.value.trim();
        const studentClass = classInput.value.trim();

        if (!name || !studentClass) {
            alert('الرجاء إدخال اسم الطالب والفصل');
            return;
        }

        try {
            saveBtn.disabled = true;
            saveBtn.textContent = 'جاري الحفظ...';

            await addDoc(collection(db, "volunteer_results"), {
                studentName: name,
                studentClass: studentClass,
                admissionStatus: "تم القبول في الفرصة",
                workStatus: "أتم العمل بنجاح",
                createdAt: new Date().toISOString()
            });

            nameInput.value = '';
            classInput.value = '';
        } catch (error) {
            console.error("خطأ أثناء الحفظ:", error);
            alert('حدث خطأ أثناء الحفظ، تأكد من الاتصال');
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = 'حفظ وإضافة للسحابة';
        }
    });

    // مزامنة الجدول وعرض البيانات مباشرة من السحابة
    onSnapshot(collection(db, "volunteer_results"), (snapshot) => {
        tableBody.innerHTML = "";
        let index = 1;
        
        snapshot.forEach((doc) => {
            const data = doc.data();
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index++}</td>
                <td>${data.studentName || ''}</td>
                <td>${data.studentClass || ''}</td>
                <td>${data.admissionStatus || 'تم القبول في الفرصة'}</td>
                <td class="status-accepted">${data.workStatus || 'أتم العمل بنجاح'}</td>
            `;
            tableBody.appendChild(row);
        });
    });
</script>

</body>
</html>
